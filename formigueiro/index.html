.m-masc{-webkit-mask-image:var(--i-masc);mask-image:var(--i-masc);aspect-ratio:360/682}

.wide{font-family:Archivo,Poppins,sans-serif;font-stretch:125%;font-weight:900;letter-spacing:.01em;text-transform:uppercase}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--red);color:var(--cream);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px 16px;overflow:hidden}
.side .brand{display:block;padding:4px 8px 4px}
.side .brand .m-logo{width:100%;color:var(--cream)}
.side .sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;padding:6px 10px 18px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--cream);text-decoration:none;font-weight:500;font-size:14px;opacity:.88}
.nav a:hover{background:rgba(255,248,230,.1);opacity:1}
.nav a.on{background:var(--cream);color:var(--red);opacity:1;font-weight:600}
.nav svg{width:19px;height:19px;flex:none}
.nav .sep{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.6;padding:14px 12px 4px;font-weight:600}
.side .masc{position:absolute;right:-34px;bottom:-30px;width:130px;color:rgba(255,248,230,.13);pointer-events:none}
.main{min-width:0;position:relative}
.top{position:sticky;top:0;z-index:20;background:rgba(255,248,230,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 28px}
.top .crumb{font-weight:600;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .mlogo{display:none}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;background:#fff;border:1px solid var(--line)}
.pts{background:var(--red);color:var(--cream);border:0}
.sel{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;max-width:210px}
.content{padding:28px 28px 90px;max-width:1240px;margin:0 auto;position:relative}
.wm{position:fixed;right:-60px;bottom:-80px;width:min(46vw,560px);color:var(--cream-2);pointer-events:none;z-index:0;opacity:.75}
.content>*{position:relative;z-index:1}
.bottom{display:none}

/* ---------- componentes ---------- */
.kicker{display:inline-block;background:var(--red);color:var(--cream);padding:5px 14px 4px;transform:skew(-10deg);font-size:12px;margin-bottom:10px}
.kicker>span{display:inline-block;transform:skew(10deg)}
.h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
.h1 em{font-style:normal;color:var(--red)}
.lead{color:var(--muted);max-width:720px;margin:8px 0 0}
.sec{margin-top:30px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h2{font-size:19px;font-weight:700}
.sec-h .more{font-size:13px;font-weight:600;color:var(--red);text-decoration:none;background:none;border:0;padding:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card.pad{padding:18px}
.card-h{background:var(--red);color:#fff;padding:11px 16px;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-b{padding:16px}
.click{cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.click:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(60,30,10,.06),0 12px 26px rgba(60,30,10,.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:0;padding:11px 20px;font-weight:600;font-size:14px;background:var(--red);color:#fff;text-decoration:none;transition:background .15s,transform .1s}
.btn:hover{background:var(--red-d)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn.ghost:hover{background:var(--rose)}
.btn.cream{background:var(--cream);color:var(--red)}
.btn.cream:hover{background:#fff}
.btn.sm{padding:7px 14px;font-size:13px}
.btn.lg{padding:15px 26px;font-size:16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--cream-3);color:var(--muted);white-space:nowrap}
.chip.red{background:var(--rose);color:var(--red)}
.chip.ok{background:var(--ok-l);color:var(--ok)}
.chip.must{background:var(--mustard-l);color:#8A6116}
.chip.dark{background:var(--ink);color:#fff}
.chip.demo{background:#fff;border:1px dashed var(--mustard);color:#8A6116}
.src{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--cream-3);border-radius:6px;padding:3px 8px}
.src b{color:var(--red);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:10px}
.bar{height:8px;background:var(--cream-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .4s ease}
.bar.must>i{background:var(--mustard)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.list li:first-child{border-top:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none;margin-top:8px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.tbl th{background:var(--red);color:#fff;text-align:left;padding:10px 12px;font-weight:600;white-space:nowrap}
.tbl th:first-child{border-top-left-radius:var(--r-s)}
.tbl th:last-child{border-top-right-radius:var(--r-s)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:nth-child(even) td{background:var(--rose)}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-s);background:#fff}
.empty{padding:26px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r);background:rgba(255,255,255,.6)}
.notice{display:flex;gap:12px;align-items:flex-start;background:var(--mustard-l);border:1px solid #E8CD92;color:#5F4311;border-radius:var(--r);padding:12px 16px;font-size:13.5px}
.notice.red{background:var(--rose);border-color:#EFC7BA;color:var(--red-d)}
.notice svg{flex:none;width:20px;height:20px;margin-top:1px}
.input{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;outline:none}
.input:focus{border-color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--cream) calc(var(--p)*1%),rgba(255,248,230,.22) 0);display:grid;place-items:center;flex:none}
.ring>div{width:76px;height:76px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-weight:800;font-size:20px;color:var(--cream)}
.stat{padding:16px}
.stat .v{font-size:28px;font-weight:800;color:var(--red);line-height:1.1}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:4px}

/* hero */
.hero{background:var(--red);color:var(--cream);border-radius:20px;padding:28px 30px;position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;min-height:250px}
.hero .slog{position:absolute;left:auto;right:150px;top:22px;width:190px;color:rgba(255,248,230,.16)}
.hero .masc{position:absolute;right:16px;bottom:-24px;width:118px;color:var(--cream)}
.hero h1{font-size:30px;font-weight:800}
.hero p{margin:6px 0 0;opacity:.9}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero .meta .chip{background:rgba(255,248,230,.16);color:var(--cream)}
.hero .cta{margin-top:20px}
.hero-r{display:flex;align-items:center;gap:16px;margin-right:120px;position:relative;z-index:1}

/* docs */
.doc{display:flex;flex-direction:column}
.doc .cover{background:var(--red);color:var(--cream);padding:18px;position:relative;min-height:128px;overflow:hidden}
.doc .cover.cream{background:var(--cream-3);color:var(--red)}
.doc .cover .sig{font-size:12px}
.doc .cover h3{font-size:19px;font-weight:800;text-transform:uppercase;margin-top:12px;max-width:72%;line-height:1.15}
.doc .cover .masc{position:absolute;right:-8px;bottom:-26px;width:70px;opacity:.95}
.doc .body{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:10px}
.doc .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}

/* produtos */
.ptile{background:var(--red);aspect-ratio:16/10;position:relative;overflow:hidden;color:var(--cream);display:flex;align-items:flex-end;padding:12px}
.ptile.alt{background:var(--cream-3);color:var(--red)}
.ptile.photo{background-size:cover;background-position:center;color:#fff}
.ptile.photo .cat{opacity:.95}
.ptile .waves{position:absolute;right:10px;top:10px;width:66px;opacity:.5}
.ptile .masc{position:absolute;right:-10px;bottom:-30px;width:64px;opacity:.22}
.ptile .cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;opacity:.85}
.embchips{display:flex;flex-wrap:wrap;gap:6px}
.ec{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--red);color:var(--red);background:#fff;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700}
.ec b{background:var(--red);color:#fff;border-radius:5px;padding:0 6px;font-size:11px}

/* emb builder */
.eb{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.eb .it{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 8px 8px 12px;font-size:12.5px;font-weight:600}
.eb .it.on{border-color:var(--red);background:var(--rose)}
.eb .it.good{border-color:var(--ok);background:var(--ok-l)}
.eb .it.bad{border-color:var(--red);background:#FFE3DA}
.step{display:flex;align-items:center;gap:4px}
.step button{width:28px;height:28px;border-radius:8px;border:0;background:var(--cream-3);font-weight:700;color:var(--red)}
.step span{min-width:18px;text-align:center;font-weight:700}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(32,26,22,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .18s ease}
.ov .panel{background:var(--cream);border-radius:20px;width:min(720px,100%);max-height:calc(100vh - 36px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:rise .22s cubic-bezier(.2,.8,.2,1)}
.ov .ph{background:var(--red);color:var(--cream);padding:16px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:2}
.ov .ph h3{font-size:16px;flex:1}
.ov .x{border:0;background:rgba(255,248,230,.16);color:var(--cream);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.ov .pb{padding:22px}
.ov.noanim,.ov.noanim .panel{animation:none}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.slide{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;min-height:220px;display:flex;flex-direction:column;justify-content:center}
.slide h4{font-size:22px;font-weight:800;color:var(--red);margin-bottom:10px}
.slide p{font-size:17px;margin:0}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--cream-2)}
.dots i.on{background:var(--red);width:22px;border-radius:99px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px 16px;margin-top:8px;font-weight:500;transition:border-color .15s}
.opt:hover{border-color:var(--red)}
.opt.good{border-color:var(--ok);background:var(--ok-l)}
.opt.bad{border-color:var(--red);background:#FFE3DA}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:14px}
.fb.good{background:var(--ok-l);color:#2E4D1D}
.fb.bad{background:#FFE3DA;color:var(--red-d)}
.ordpool button,.ordsel button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;margin-top:6px;font-weight:500}
.ordsel button{border-color:var(--red)}
.ordsel b{background:var(--red);color:#fff;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none}

/* modules */
.mod{display:flex;gap:14px;align-items:flex-start;padding:16px;border-top:1px solid var(--line)}
.mod:first-child{border-top:0}
.mod .num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--cream-3);color:var(--red);flex:none}
.mod.done .num{background:var(--ok);color:#fff}
.mod.lock{opacity:.55}
.mod .body{flex:1;min-width:0}
.aula-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--cream-3);margin-top:6px;font-size:13.5px}
.aula-row .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--gray);flex:none;display:grid;place-items:center}
.aula-row .ck.on{background:var(--ok);border-color:var(--ok);color:#fff}

/* gantt */
.gantt{display:grid;grid-template-columns:220px repeat(20,minmax(24px,1fr));gap:3px;font-size:11.5px;min-width:840px}
.gantt .lb{background:var(--gray);color:var(--ink);font-weight:700;text-transform:uppercase;font-size:10.5px;padding:6px 8px;border-radius:5px;display:flex;align-items:center}
.gantt .c{background:#DDD8D2;border-radius:4px;min-height:26px}
.gantt .c.r{background:var(--red)}
.gantt .c.y{background:var(--mustard)}
.gantt .mh{grid-column:span 4;text-align:center}
.gantt .mh span{display:inline-block;background:var(--red);color:#fff;padding:2px 10px;transform:skew(-10deg);font-size:11px}
.gantt .row-on .lb{background:var(--red);color:#fff}

/* matriz */
.mx td.cell{text-align:center;font-weight:600;font-size:12px;cursor:pointer}
.st-A{background:var(--ok-l)!important;color:var(--ok)}
.st-E{background:var(--mustard-l)!important;color:#8A6116}
.st-P{background:#fff!important;color:var(--muted)}
.st-B{background:#EEE9E3!important;color:#9A8F86}

/* accordion */
details.acc{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-top:10px;overflow:hidden}
details.acc summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:12px;font-weight:600}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .pg{margin-left:auto}
details.acc[open] summary{border-bottom:1px solid var(--line);background:var(--rose)}
details.acc .in{padding:6px 16px 14px}

.search-xl{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--red);border-radius:16px;padding:6px 6px 6px 16px;box-shadow:var(--shadow)}
.search-xl input{flex:1;border:0;outline:0;font-size:17px;padding:10px 0;background:transparent;min-width:0}
.qa{background:#fff;border:1px solid var(--line);border-left:5px solid var(--red);border-radius:12px;padding:14px 16px}
.qa h4{font-size:15px;margin-bottom:4px}
mark{background:var(--mustard-l);color:inherit;border-radius:3px;padding:0 2px}
.flash{perspective:1000px;height:240px;cursor:pointer}
.flash .fi{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flash.flip .fi{transform:rotateY(180deg)}
.flash .fa,.flash .fbk{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px}
.flash .fa{background:var(--red);color:var(--cream)}
.flash .fbk{background:#fff;border:2px solid var(--red);transform:rotateY(180deg)}
.cert{background:var(--cream);border:8px solid var(--red);border-radius:16px;padding:30px;text-align:center;position:relative;overflow:hidden}
.cert .m-logo{width:240px;color:var(--red)}
.cert .masc{position:absolute;left:-14px;bottom:-30px;width:90px;color:var(--cream-2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:rise .2s ease}
.badge{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.badge .ic{width:42px;height:42px;border-radius:50%;background:var(--red);color:var(--cream);display:grid;place-items:center;flex:none}
.badge.off{opacity:.45;filter:grayscale(1)}
.badge .ic svg{width:22px;height:22px}
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px}
.filters select{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-weight:500;font-size:13.5px;min-width:0}
.pipeline{display:flex;gap:4px;flex-wrap:wrap}
.pipeline span{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--cream-3);color:var(--muted)}
.pipeline span.on{background:var(--red);color:#fff}
.pipeline span.past{background:var(--rose);color:var(--red)}
.drop{border:2px dashed var(--red);border-radius:16px;padding:26px;text-align:center;background:rgba(255,255,255,.7)}
.hidden{display:none!important}
.card-h .tabs button{background:rgba(255,255,255,.16);border-color:transparent;color:#fff}
.card-h .tabs button.on{background:#fff;color:var(--red)}
.btn svg,.chip svg{width:16px;height:16px}
.badge .ic svg{width:22px;height:22px}
body.big .small{font-size:16px}body.big .xs{font-size:14px}body.big .qa h4{font-size:19px}body.big .tbl{font-size:16px}


/* ===== formato Ficha Técnica Operacional ===== */
:root{--ft:#BD4F38;--ft-d:#9B2D1F}
.fts{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.ftb{background:var(--ft);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px;min-height:56px}
.ftb .lbl{font-size:12.5px;line-height:1.15;font-weight:400;min-width:92px}
.ftb .ttl{flex:1;text-align:center;font-weight:700;text-transform:uppercase;font-size:clamp(14px,1.6vw,20px);letter-spacing:.01em}
.ftb .m-logo{width:128px;color:#fff;margin-left:auto}
.ftr{height:2px;background:var(--ft);margin:6px 18px 0;opacity:.9}
.ftbody{padding:18px 22px 24px}
.ftgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
.ftgrid.op{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.ftcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.ftp{border:3px solid var(--ft-d);border-radius:10px;overflow:hidden;background:#eee;line-height:0}
.ftp img{width:100%;height:100%;max-height:520px;object-fit:cover;display:block}
.ftp.mini img{max-height:220px}
.ftt{border:2px solid var(--ft-d);border-radius:8px;overflow:hidden;background:#fff;line-height:0}
.ftt img{width:100%;display:block}
.ftt-t{color:var(--ft);font-weight:800;text-transform:uppercase;font-size:clamp(20px,2.4vw,32px);line-height:1.08;margin:0}
.ftt-t.sm{font-size:clamp(15px,1.5vw,19px);text-align:center}
.fto{border:1.6px solid #2a2320;border-radius:20px;padding:12px 18px 14px;text-align:center;background:#fff}
.fto h5{margin:0 0 6px;font-size:13px;letter-spacing:.14em;font-weight:700}
.fto p{margin:0;font-size:13.5px;line-height:1.45}
.fto.sm p{font-size:12.5px}
.ftmulti{display:grid;gap:18px}
.ftmulti.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.ftmulti.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ftmulti .ftp img{aspect-ratio:4/3;max-height:none}
.ftsal{display:grid;gap:16px;margin-top:14px}
.ftsal.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ftsal.c2{grid-template-columns:repeat(2,minmax(0,1fr));max-width:900px}
.ftsal.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.ftcard{display:flex;flex-direction:column;gap:10px;text-decoration:none;transition:transform .15s}
.ftcard:hover{transform:translateY(-2px)}
.ftcard .ftp img{max-height:none}
.fts.cover{min-height:380px;display:flex;flex-direction:column}
.fts.cover .cb{background:var(--ft);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:26px 30px;min-height:150px}
.fts.cover .cb .lbl{font-size:clamp(16px,2vw,24px);line-height:1.15}
.fts.cover .cb .m-logo{width:min(260px,38vw);color:#fff}
.fts.cover .cw{flex:1;position:relative;padding:30px;display:flex;align-items:center;overflow:hidden}
.fts.cover h2{color:var(--ft);font-size:clamp(28px,4.6vw,58px);font-weight:800;text-transform:uppercase;line-height:1.02;position:relative;z-index:1}
.fts.cover .ghost{position:absolute;right:4%;top:8%;width:min(320px,40vw);color:#F6ECE9}
.mbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
.seg{display:inline-flex;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--red);color:#fff}
.mnav{display:flex;gap:10px;align-items:center}
.steps{margin:0;padding-left:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);background:var(--ft);color:#fff;border-radius:50%;width:24px;height:24px;flex:none;display:grid;place-items:center;font-weight:700;font-size:12px}
.fcimg{aspect-ratio:4/3;background:#eee;overflow:hidden}
.fcimg img{width:100%;height:100%;object-fit:cover;display:block}
.fdoc .ftb{min-height:52px}
.fdoc .ftb .lbl{font-weight:600;font-size:11.5px}
.fdoc .ftb .m-logo{width:104px}
.fdoc .body{padding:14px 16px}
.dstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px 12px 0}
.dstrip img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:2px solid var(--ft-d)}
.ftlist{list-style:none;margin:12px 0 0;padding:0}
.ftlist li{position:relative;padding:9px 0 9px 22px;border-top:1px solid #f0e4dd;font-size:14.5px}
.ftlist li:first-child{border-top:0}
.ftlist li::before{content:"";position:absolute;left:4px;top:16px;width:9px;height:9px;border-radius:2px;background:var(--ft);transform:rotate(45deg)}
.qa.qimg{display:flex;gap:12px}
.qa.qimg>img{width:86px;height:86px;object-fit:cover;border-radius:10px;border:2px solid var(--ft-d);flex:none}
@media (max-width:820px){
  .ftgrid,.ftgrid.op,.ftmulti.c2,.ftmulti.c3{grid-template-columns:1fr}
  .ftsal.c3,.ftsal.c4,.ftsal.c2{grid-template-columns:1fr 1fr}
  .ftb{padding:8px 12px;min-height:46px}.ftb .lbl{font-size:10.5px;min-width:70px}.ftb .m-logo{width:92px}.ftb .ttl{font-size:13px}
  .ftbody{padding:14px}
  .ftp img{max-height:340px}
  .mnav .sel{min-width:0}
  .mbar .tabs{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:4px}
  .mbar .tabs button{white-space:nowrap}
  .mlead{display:none}
  .fts.cover{min-height:260px}.fts.cover .cb{min-height:96px;padding:16px}
}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:1fr 1fr}.filters>:first-child{grid-column:1/-1}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{background:var(--red);color:var(--cream);border:0;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
  .top .mlogo{display:block;width:118px;color:var(--cream);flex:none}
  .top .crumb{display:none}
  .top .sel{max-width:132px;padding:6px 10px;font-size:12px;color:var(--ink)}
  .top .pts{white-space:nowrap;padding:6px 10px}
  .top .pts svg{display:none}
  .top .pts{background:var(--cream);color:var(--red)}
  .top .spacer{flex:1}
  .content{padding:18px 14px 110px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .g4.keep2,.g3.keep2,.g2.keep2{grid-template-columns:1fr 1fr}
  .h1{font-size:24px}
  .hero{grid-template-columns:1fr;padding:22px 20px 24px;min-height:0}
  .hero h1{font-size:23px}
  .hero-r{margin-right:0}
  .hero .slog{display:none}
  .hero .masc{width:84px;right:6px;bottom:-18px}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);padding:6px 4px max(6px,env(safe-area-inset-bottom))}
  .bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 0}
  .bottom a svg{width:22px;height:22px}
  .bottom a.on{color:var(--red)}
  .filters{grid-template-columns:1fr}
  .ov{padding:0;align-items:flex-end}
  .ov .panel{border-radius:20px 20px 0 0;max-height:94vh}
  .wm{display:none}
}
.mnav .btn{white-space:nowrap}
.dico{width:40px;height:40px;border-radius:12px;background:var(--rose);color:var(--red);display:grid;place-items:center;margin-bottom:10px}
@media(max-width:760px){.hide-m{display:none!important}}
/* tabela de ingredientes na ID */
.ftab{border:2px solid var(--ft-d);border-radius:12px;overflow:hidden;background:#fff}
.ftab-t{background:var(--cream);color:var(--ft);font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.02em;padding:9px 14px;border-bottom:2px solid var(--ft-d)}
.ftab table{width:100%;border-collapse:collapse;font-size:14px}
.ftab th{background:var(--ft);color:var(--cream);font-weight:700;text-transform:uppercase;font-size:11.5px;letter-spacing:.08em;text-align:left;padding:9px 12px}
.ftab td{padding:8px 12px;border-top:1px solid var(--line);font-weight:600;color:var(--ink)}
.ftab tbody tr:nth-child(even):not(.sec) td{background:#FFFBF3}
.ftab .u{color:var(--muted);font-weight:600;width:56px}
.ftab .q{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;width:90px}
.ftab td.q{color:var(--ft);font-weight:800}
.ftab tr.sec td{background:var(--mustard-l);color:#7A5310;text-align:center;font-weight:800;letter-spacing:.14em;font-size:11.5px;padding:6px}
.ftab-o{display:block;width:100%;border:0;border-top:1px solid var(--line);background:#fff;color:var(--muted);font-size:12px;font-weight:600;padding:7px;cursor:pointer}
.ftab-o:hover{color:var(--ft)}
.ftab.mini table{font-size:11.5px}.ftab.mini td{padding:4px 7px}.ftab.mini th{padding:5px 7px;font-size:9.5px}.ftab.mini .q{width:auto}.ftab.mini .u{width:auto}.ftab.mini .ftab-t{font-size:10.5px;padding:5px 8px}
.ebar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding-top:4px}
.hist{list-style:none;margin:0;padding:0}.hist>li{padding:12px 0;border-top:1px solid var(--line)}.hist>li:first-child{border-top:0;padding-top:0}
.hist .mud{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink)}.hist .mud li{margin:2px 0}
.ov .panel.wide{width:min(860px,100%)}
.lbl2{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.edtab{border:1.5px solid var(--line);border-radius:14px;padding:4px 14px 14px;margin-top:14px;background:#fff}
.er{display:grid;grid-template-columns:minmax(0,1fr) 84px 104px 36px;gap:6px;margin-top:6px;align-items:center}
.er .input{padding:9px 10px;font-size:14px}
.er .q{text-align:right}
.er.head{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:10px}
.er.sec .input{background:var(--mustard-l);font-weight:700;text-transform:uppercase;grid-column:1/4}
.er.sec span{display:none}
.rm{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--red);font-size:18px;line-height:1;cursor:pointer}
textarea.input{resize:vertical;font-family:inherit}
@media(max-width:760px){.er{grid-template-columns:minmax(0,1fr) 70px 84px 34px}.ftab table{font-size:13px}}
/* início: menu de itens */
.hhead .ftb .ttl{font-size:clamp(16px,2vw,24px)}
.hbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 20px 6px}
.hbar .input{flex:1;min-width:220px}
.hcaps{padding:8px 20px 16px}
.hcaps .tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.hcaps .tabs button{white-space:nowrap}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.mitem{display:flex;flex-direction:column;background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:var(--ink);transition:transform .12s,border-color .12s,box-shadow .12s}
.mitem:hover{transform:translateY(-2px);border-color:var(--ft);box-shadow:0 8px 20px rgba(155,45,31,.12)}
.mitem .ph{aspect-ratio:4/3;background:#eee;overflow:hidden;border-bottom:3px solid var(--ft)}
.mitem .ph img{width:100%;height:100%;object-fit:cover;display:block}
.mitem .tx{padding:9px 11px 11px;display:flex;flex-direction:column;gap:3px}
.mitem b{font-size:13.5px;line-height:1.25;font-weight:700}
.mitem span{font-size:11.5px;color:var(--muted)}
.mitem em{font-style:normal;color:#8A6116;font-weight:700}
.dlink{display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px}
/* manual: índice clicável */
.mlay{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
.midx{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow-y:auto;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:8px}
.midx .mg{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ft);padding:12px 8px 6px}
.midx button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:6px;border-radius:10px;cursor:pointer;color:var(--ink)}
.midx button:hover{background:var(--cream-3)}
.midx button.on{background:var(--ft);color:#fff}
.midx button.on small{color:rgba(255,255,255,.8)}
.midx img,.midx .nt{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--rose);display:grid;place-items:center;color:var(--ft)}
.midx .tt{display:flex;flex-direction:column;min-width:0}
.midx b{font-size:12.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.midx small{font-size:11px;color:var(--muted)}
@media(max-width:900px){
  .mlay{grid-template-columns:1fr}
  .midx{position:static;max-height:none;display:flex;overflow-x:auto;overflow-y:hidden;gap:6px;padding:8px}
  .midx .mg{display:none}
  .midx button{flex:none;width:150px;flex-direction:column;align-items:flex-start;gap:6px}
  .midx img,.midx .nt{width:100%;height:84px}
  .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.fbox{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:6px 16px 16px}
.fbox .tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.fbox .tabs button{white-space:nowrap}
.flbl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ft);margin:12px 0 8px}
.tabs button .n{font-size:11px;opacity:.7;margin-left:2px}
.mitem .ph{position:relative}
.mitem .cc{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.94);color:var(--ft);font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.mitem .cc.c-del{background:var(--ft);color:#fff}.mitem .cc.c-sal2{background:var(--mustard);color:#fff}
/* documentos com miniatura */
.dcard{display:flex;flex-direction:column;overflow:hidden}
.dcard .thumb{display:flex;align-items:center;justify-content:center;height:250px;padding:22px;background:#F6EEE3;border-bottom:1px solid var(--line);text-decoration:none;position:relative}
.dcard .thumb img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 10px 24px rgba(59,26,16,.22),0 2px 4px rgba(59,26,16,.12);transition:transform .2s;background:#fff}
.dcard .thumb:hover img,.dcard .thumb:hover .capa{transform:translateY(-3px)}
.dcard .badge{position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#fff;color:var(--ft);padding:4px 9px;border-radius:999px}
.dcard .st{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;color:#fff;background:var(--mustard)}
.dcard .capa{height:100%;aspect-ratio:.707;background:#FFF3DF;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(59,26,16,.22),0 2px 4px rgba(59,26,16,.12);transition:transform .2s;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;text-align:right}
.dcard .capa b{color:var(--ft);font-weight:800;text-transform:uppercase;font-size:13px;line-height:1.12;max-width:62%;position:relative;z-index:1}
.dcard .capa .m-slog{position:absolute;left:8px;top:10px;width:56%;color:var(--ft)}
.dcard .capa .m-masc{position:absolute;left:-14px;bottom:-14px;width:46%;color:var(--ft);opacity:.95}
.dcard .capa .m-logo{position:absolute;right:10px;bottom:10px;width:48%;color:var(--ft)}
.dcard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.dcard h3{margin:0;font-size:16px;font-weight:800;color:var(--ink);line-height:1.25}
.dcard .acts{margin-top:auto;padding-top:8px;display:flex;gap:8px;flex-wrap:wrap}
/* trava por PIN */
body.locked{overflow:hidden}
body.locked .app,body.locked .bottom{filter:blur(14px);pointer-events:none;user-select:none}
#pinlock{position:fixed;inset:0;z-index:500;background:rgba(155,45,31,.92);display:grid;place-items:center;padding:20px}
#pinlock .pbox{width:min(380px,100%);background:var(--ft);color:var(--cream);border-radius:22px;padding:30px 26px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}
#pinlock .m-logo{width:190px;color:var(--cream)}
#pinlock .plbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.8;margin-top:14px}
#pinlock h2{font-size:22px;font-weight:800;margin:4px 0 6px}
#pinlock p{margin:0 0 16px;opacity:.9;font-size:14px}
#pinlock form{display:flex;gap:8px;justify-content:center}
#pinlock input{width:140px;text-align:center;font-size:26px;letter-spacing:.4em;padding:10px 8px;border-radius:14px;border:2px solid rgba(255,248,230,.5);background:rgba(255,248,230,.12);color:#fff;font-weight:800;outline:none}
#pinlock input:focus{border-color:var(--cream)}
#pinlock input::placeholder{color:rgba(255,248,230,.5)}
#pinlock .perr{min-height:20px;margin-top:10px;font-size:13px;font-weight:700;color:#FFE1A8}
#pinlock .shake{animation:pshake .35s}

<script>const MONT=[{"p": 1, "tipo": "capa", "t": "Manual de Montagem de Pratos"}, {"p": 2, "tipo": "cap", "t": "Padrões Operacionais", "cap": "op"}, {"p": 3, "tipo": "ficha", "cap": "op", "t": "Padrão de separação de pedidos", "ph": ["f03_6.jpg"], "tb": [], "obs": "1-Os pedidos chegam na cozinha e são organizados em \"lotes\"de 4 a 5 comandas. Essas comandas são entregues a um montador. 2-Ele coloca essas comandas sobre sua bancada e inicia a montagem. 3-Ele vai buscando no PASS TROUGH os itens já porcionados (farofa, arroz, purê, entre outros) e após, vai até o BUFFET CENTRAL onde coleta o que mais precisa. PADRÃO DE SEPARAÇÃO DE PEDIDOS 4-Caso necessite de uma massa ou uma proteína, solicita ao chapeiro (caso de proteínas como carne, churrasco misto, etc) ou ao cozinheiro (itens como arroz maluco, massas e outras preparações. 5-Junta tudo e embala conforme o padrão da marca."}, {"p": 4, "tipo": "ficha", "cap": "op", "t": "Padrão bancada de montagem (embalagens)", "ph": ["f04_9.jpg"], "tb": [], "obs": "A parte aérea da bancada abriga os potes, embalagens de marmitas, sacolas, descartáveis entre outros itens importantes na montagem das comandas. Importante que a área esteja sempre organizada, para facilitar o aumento da velocidade operacional."}, {"p": 5, "tipo": "cap", "t": "Padrão Preparos", "cap": "prep"}, {"p": 6, "tipo": "ficha", "cap": "prep", "t": "Legumes no vapor", "ph": ["f06_15.jpg"], "tb": ["t06_18.png"], "obs": "Sempre coloque nos pratos na proporção de ¼ de cada item."}, {"p": 7, "tipo": "ficha", "cap": "prep", "t": "Arroz branco", "ph": ["f07_19.jpg"], "tb": ["t07_22.png"], "obs": "Mantenha na GN durante a operação e vá repondo conforme demanda. Sempre mexer um pouco para mantê-lo sempre solto."}, {"p": 8, "tipo": "ficha", "cap": "prep", "t": "Arroz de brócolis", "ph": ["f08_23.jpg"], "tb": ["t08_26.png"], "obs": "Mantenha na GN durante a operação e vá repondo conforme demanda. Sempre mexer um pouco para mantê-lo sempre solto."}, {"p": 9, "tipo": "ficha", "cap": "prep", "t": "Carne de panela", "ph": ["f09_27.jpg"], "tb": ["t09_30.png"], "obs": "Mexa antes de servir. Coloque carne na montagem do prato, mas também adicione o molho."}, {"p": 10, "tipo": "ficha", "cap": "prep", "t": "Strogonoff de frango", "ph": ["f10_31.jpg"], "tb": ["t10_34.png"], "obs": "Sempre mexa antes de servir. Pegue porções que contenham a proteína e também o caldo."}, {"p": 11, "tipo": "ficha", "cap": "prep", "t": "Purê de batatas", "ph": ["f11_35.jpg"], "tb": ["t11_38.png"], "obs": "Mexa sempre antes de servir."}, {"p": 12, "tipo": "ficha", "cap": "prep", "t": "Farofa de ovos", "ph": ["f12_39.jpg"], "tb": ["t12_42.png"], "obs": ""}, {"p": 13, "tipo": "multi", "cap": "prep", "itens": [{"t": "Sobrecoxa", "ph": ["f13_43.jpg"], "tb": [], "obs": "Não faça grandes quantidades para evitar ressecamento da proteína."}, {"t": "Filé de frango", "ph": ["f13_46.jpg"], "tb": [], "obs": "Não faça grandes quantidades para evitar ressecamento da proteína."}, {"t": "Batata portuguesa", "ph": ["f13_47.jpg"], "tb": [], "obs": "Mantenha a batata sempre no container. Evite as batatas queimadas."}]}, {"p": 14, "tipo": "cap", "t": "Padrão Pratos Delivery", "cap": "del"}, {"p": 15, "tipo": "ficha", "cap": "del", "t": "Milanesa de carne", "ph": ["f15_51.jpg"], "tb": ["t15_54.png"], "obs": "Coloque o arroz como a primeira camada, seguido pela batata frita, e posicione o bife à milanesa por cima, tudo na mesma embalagem. O feijão deve ser colocado em uma embalagem separada."}, {"p": 16, "tipo": "ficha", "cap": "del", "t": "Frango crocante com espaguete ao molho de 4 queijos", "ph": ["f16_55.jpg"], "tb": ["t16_58.png"], "obs": "Coloque o espaguete com molho de quatro queijos na mesma embalagem. O filé de frango deve ser enviado separadamente, em embalagem individual."}, {"p": 17, "tipo": "ficha", "cap": "del", "t": "Fettuccine ao sugo", "ph": ["f17_59.jpg"], "tb": ["t17_62.png"], "obs": "Coloque todo o fettuccine na embalagem plástica para armazenamento adequado."}, {"p": 18, "tipo": "ficha", "cap": "del", "t": "Milanesa de carne · Marmita", "ph": ["f18_63.jpg"], "tb": ["t18_66.png"], "obs": "Coloque o feijão como a primeira camada, seguido pelo arroz, e posicione o bife à milanesa por cima. As batatas devem ser acondicionadas em saco individual."}, {"p": 19, "tipo": "ficha", "cap": "del", "t": "Parmegiana com purê", "ph": ["f19_67.jpg"], "tb": ["t19_70.png"], "obs": "Coloque o filé de frango à parmegiana em uma embalagem individual. O purê e o arroz devem ser acondicionados separadamente."}, {"p": 20, "tipo": "ficha", "cap": "del", "t": "Coração da alcatra", "ph": ["f20_71.jpg"], "tb": ["t20_74.png"], "obs": "Coloque o arroz como a camada base, seguido pelo bife. A batata portuguesa deve ser acondicionada em um saquinho individual, enquanto o feijão deve ser armazenado em uma embalagem adequada."}, {"p": 21, "tipo": "multi", "cap": "del", "itens": [{"t": "Frango crocante pra 2", "ph": ["f21_75.jpg"], "tb": [], "obs": "Dividir o arroz, o frango crocante, o feijão e a batata portuguesa em embalagens individuais."}, {"t": "Espaguete para 2", "ph": ["f21_76.jpg"], "tb": [], "obs": "Acondicionar todo o espaguete na embalagem plástica apropriada para sua conservação."}]}, {"p": 22, "tipo": "ficha", "cap": "del", "t": "Frango com legumes", "ph": ["f22_79.jpg"], "tb": ["t22_82.png"], "obs": "Colocar o arroz, o frango e os legumes na embalagem de delivery, enquanto o purê de batata deve ser acondicionado em uma embalagem separada."}, {"p": 23, "tipo": "imagem", "cap": "del", "t": "Frango com legumes (versão 2)", "ph": ["f23_83.jpg"]}, {"p": 24, "tipo": "ficha", "cap": "del", "t": "Filé de peixe grelhado com legumes", "ph": ["f24_84.jpg"], "tb": ["t24_87.png", "t24_88.png"], "obs": "Coloque o arroz, o filé de peixe e os legumes na embalagem de entrega."}, {"p": 25, "tipo": "ficha", "cap": "del", "t": "Milanesa de carne com fritas", "ph": ["f25_89.jpg"], "tb": ["t25_92.png"], "obs": "Coloque o arroz, o frango e a batata frita na embalagem de delivery, enquanto o feijão deve ser acondicionado em um recipiente separado."}, {"p": 26, "tipo": "ficha", "cap": "del", "t": "Milanesa de carne com batata chips", "ph": ["f26_93.jpg"], "tb": ["t26_96.png"], "obs": "Coloque o arroz como a primeira camada e, em seguida, posicione o bife à milanesa por cima. As batatas devem ser acondicionadas em saco individual, enquanto o feijão deve ser armazenado em uma embalagem separada."}, {"p": 27, "tipo": "ficha", "cap": "del", "t": "Frango crocante com batata chips", "ph": ["f27_97.jpg"], "tb": ["t27_100.png"], "obs": "Coloque o arroz como a primeira camada e, em seguida, posicione o frango crocante por cima. As batatas devem ser acondicionadas em saco individual, enquanto o feijão deve ser armazenado em uma embalagem separada."}, {"p": 28, "tipo": "ficha", "cap": "del", "t": "Frango crocante com fritas", "ph": ["f28_101.jpg"], "tb": ["t28_104.png"], "obs": "Coloque o arroz, o frango crocante e a batata frita na embalagem de delivery, enquanto o feijão deve ser acondicionado em um recipiente separado."}, {"p": 29, "tipo": "ficha", "cap": "del", "t": "Filé de frango crocante com espaguete ao alho e óleo", "ph": ["f29_105.jpg"], "tb": ["t29_108.png"], "obs": "Coloque o espaguete junto ao filé de frango crocante na embalagem para delivery."}, {"p": 30, "tipo": "ficha", "cap": "del", "t": "Parmegiana de frango com fritas", "ph": ["f30_109.jpg"], "tb": ["t30_112.png"], "obs": "Coloque o arroz e a batata frita juntos, enquanto o feijão deve ser armazenado em uma embalagem separada, assim como o frango à parmegiana."}, {"p": 31, "tipo": "multi", "cap": "del", "itens": [{"t": "Nhoque ao sugo", "ph": ["f31_113.jpg"], "tb": ["t31_117.png"], "obs": ""}, {"t": "Nhoque 4 queijos", "ph": ["f31_114.jpg"], "tb": ["t31_118.png"], "obs": ""}]}, {"p": 32, "tipo": "ficha", "cap": "del", "t": "Espaguete com almôndegas", "ph": ["f32_119.jpg"], "tb": ["t32_122.png"], "obs": "Coloque o espaguete com almôndegas em uma embalagem adequada para entrega e finalize com queijo ralado."}, {"p": 33, "tipo": "ficha", "cap": "del", "t": "Lasanha à bolonhesa", "ph": ["f33_123.jpg"], "tb": ["t33_126.png"], "obs": "1. Esquente a lasanha por 3 minutos. 2. Adicione o molho. 3. Coloque o queijo por cima. Aqueça novamente por aproximadamente 1 minuto."}, {"p": 34, "tipo": "ficha", "cap": "del", "t": "Penne ao molho misto", "ph": ["f34_127.jpg"], "tb": ["t34_130.png"], "obs": "Misture o penne com o molho de cheddar e finalize com bacon crocante e queijo ralado."}, {"p": 35, "tipo": "ficha", "cap": "del", "t": "Escondidinho", "ph": ["f35_131.jpg"], "tb": ["t35_134.png"], "obs": ""}, {"p": 36, "tipo": "multi", "cap": "del", "itens": [{"t": "Escondidinho com arroz, feijão e batata portuguesa", "ph": ["f36_135.jpg"], "tb": [], "obs": "Coloque o arroz e o escondidinho em uma embalagem adequada para delivery. A batata portuguesa deve ser acondicionada em um saquinho individual, enquanto o feijão será colocado em outra embalagem separada."}, {"t": "Escondidinho para 3", "ph": ["f36_136.jpg"], "tb": [], "obs": ""}]}, {"p": 37, "tipo": "ficha", "cap": "del", "t": "Almôndegas com arroz e feijão", "ph": ["f37_139.jpg"], "tb": ["t37_142.png"], "obs": "Separe o arroz e as almôndegas. Em seguida, coloque a farofa em uma embalagem individual, assim como o feijão."}, {"p": 38, "tipo": "ficha", "cap": "del", "t": "Coxa com sobrecoxa assada", "ph": ["f38_143.jpg"], "tb": ["t38_146.png"], "obs": "Coloque o arroz e a coxa com sobrecoxa em uma embalagem adequada para delivery. A maionese deve ser acondicionada em uma embalagem individual, enquanto o feijão será colocado em outra embalagem separada."}, {"p": 39, "tipo": "ficha", "cap": "del", "t": "Strogonoff de frango", "ph": ["f39_147.jpg"], "tb": ["t39_150.png"], "obs": "Coloque o arroz e a batata portuguesa em uma embalagem apropriada para delivery, enquanto o strogonoff deverá ser armazenado em uma embalagem separada."}, {"p": 40, "tipo": "ficha", "cap": "del", "t": "Filé de peixe grelha umes devem ser colocados na embalagem de delivery, enquanto a salada colorida deve ser acondicionado em uma embalagem separada."}, {"p": 47, "tipo": "ficha", "cap": "del", "t": "Bife de alcatra acebolado", "ph": ["f47_180.jpg"], "tb": ["t47_181.png"], "obs": "Coloque o arroz e o bife acebolado na embalagem de delivery, enquanto o feijão deve ser acondicionado em um recipiente separado. A batata portuguesa deve ser embalada em um saquinho individual."}, {"p": 48, "tipo": "ficha", "cap": "del", "t": "Escalope com arroz à piamontese", "ph": ["f48_184.jpg"], "tb": ["t48_187.png"], "obs": "Coloque o arroz à piamontese, a batata frita e o bife com molho madeira em embalagens distintas."}, {"p": 49, "tipo": "ficha", "cap": "del", "t": "Salpicão", "ph": ["f49_188.jpg"], "tb": ["t49_191.png"], "obs": "Coloque o salpicão em embalagem para delivery."}, {"p": 50, "tipo": "ficha", "cap": "del", "t": "Arroz de costela", "ph": ["f50_192.jpg"], "tb": ["t50_195.png"], "obs": "Coloque o arroz de costela e, por cima, o ovo frito na embalagem de delivery."}, {"p": 51, "tipo": "ficha", "cap": "del", "t": "Churrasco misto para 1", "ph": ["f51_196.jpg"], "tb": ["t51_199.png"], "obs": "Coloque o arroz ao lado do churrasco misto. Em embalagens separadas, adicione a batata frita, a farofa e o feijão."}, {"p": 52, "tipo": "ficha", "cap": "del", "t": "Churrasco misto para 2", "ph": ["f52_200.jpg"], "tb": ["t52_203.png"], "obs": "As embalagens devem ser separadas para o arroz, o churrasco misto, a farofa, batata frita e o molho à campanha."}, {"p": 53, "tipo": "ficha", "cap": "del", "t": "Feijoada pra 1", "ph": ["f53_204.jpg"], "tb": ["t53_207.png"], "obs": "Envie os itens de forma separada: feijão em uma embalagem, farofa em um pote pequeno e, em um pote maior, arroz, couve, torresmo e rodelas de laranja."}, {"p": 54, "tipo": "ficha", "cap": "del", "t": "Fígado acebolado", "ph": ["f54_208.jpg"], "tb": ["t54_211.png"], "obs": "Coloque o arroz ao lado do fígado acebolado em uma embalagem de deli });

}

const phImg = (f, cls = "") => `<div class="ftp ${cls}"><img loading="lazy" src="${IMGP(f)}" alt=""></div>`;

function slide(pg) {
  if (pg.tipo === "capa" || pg.tipo === "cap") {
    const t = pg.tipo === "capa" ? "Manual de<br>Montagem de Pratos" : esc(pg.t).replace(/ (?=[^ ]+$)/, "<br>");

  }
  if (pg.tipo === "imagem") return `<div class="fts">${band()}<div class="ftbody"><div class="ftp" style="max-width:860px;margin:0 auto"><img loading="lazy" src="${IMGP(pg.ph[0])}" alt=""></div></div></div>`;
  if (pg.tipo === "ficha") {

    return `<div class="fts">${band(pg.cap === "prep" ? esc(pg.t) : "")}<div class="ftbody"><div class="ftgrid ${op ? "op" : ""}">

      <div class="ftcol">${pg.cap === "prep" ? "" : `<h3 class="ftt-t">${esc(d.t)}</h3>`}${tabsHTML(d)}${pg.ph[1] ? phImg(pg.ph[1], "mini") : ""}${obsBox(d.obs)}${editBar(fidOfPage(pg))}</div>
    </div></div></div>`;

  if (pg.tipo === "multi") return `<div class="fts">${band()}<div class="ftbody"><div class="ftmulti c${pg.itens.length}">${pg.itens.map((it, i) => { const d = FD(fidOfPage(pg, i)); return `<div class="ftcol"><h3 class="ftt-t sm">${esc(d.t)}</h3>${phImg(it.ph[0])}${tabsHTML(d)}${obsBox(d.obs, 1)}${editBar(fidOfPage(pg, i))}</div>`; }).join("")}</div></div></div>`;
  if (pg.tipo === "salao") return `<div class="fts">${band()}<div class="ftbody"><h3 class="ftt-t">${esc(pg.t).replace(/·/g, "-")}</h3><div class="ftsal c${Math.min(pg.cards.length, 4)}">${pg.cards.map(c => `<a class="ftcard" href="#ficha-${c.id}">${phImg(c.ph)}${tabsHTML(FD(c.id), 1)}${ED[c.id] ? `<span class="chip must" style="align-self:flex-start">Editada</span>` : ""}</a>`).join("")}</div></div></div>`;
  return "";
}
const pageName = m => m.tipo === "multi" ? m.itens.map(x => x.t).join(" + ") : m.tipo === "salao" ? m.t + " (" + m.cards.length + " pratos)" : m.t;
const capPages = cap => MONT.filter(m => !cap || m.cap === cap || (m.tipo === "capa" && !cap));
const fichaCard = f => `<a class="card click" href="#ficha-${f.id}" style="text-decoration:none;color:inherit"><div class="fcimg"><img loading="lazy" src="${IMGP(f.ph[0])}" alt=""></div><div style="padding:10px 12px"><b class="small" style="display:block;line-height:1.3">${esc(FD(f.id).t)}</b><div class="row" style="margin-top:6px"><span class="chip">Pág. ${f.p}</span><span class="chip red">${esc(CAPN(f.cap))}</span>${ED[f.id] ? `<span class="chip must">Editada</span>` : ""}</div></div></a>`;
const capTabs = (cur, act) => `<div class="tabs" style="margin:0"><button class="${!cur ? "on" : ""}" data-a="${act}" data-v="">Tudo</button>${MCAPS.map(c => `<button class="${cur === c.id ? "on" : ""}" data-a="${act}" data-v="${c.id}">${esc(c.nome)}</button>`).join("")}</div>`;

/* ---------- navegação ---------- */
const NAV = [["inicio", "Início", IC.home], ["manual", "Manual de Montagem", IC.book], ["fichas", "Fichas dos Pratos", IC.plate], ["docs", "Documentos", IC.folder], ["historico", "Histórico", IC.doc]];
function route() { const h = (location.hash || "#inicio").slice(1); const i = h.indexOf("-"); return i > 0 ? { v: h.slice(0, i), p: h.slice(i + 1) } : { v: h, p: null }; }

  $("#nav").innerHTML = NAV.map(n => `<a href="#${n[0]}" class="${on === n[0] ? "on" : ""}">${n[2]}<span>${n[1]}</span></a>`).join("");

  $("#crumb").textContent = ({ inicio: "Manual de Montagem de Pratos", manual: "Manual de Montagem", fichas: "Fichas dos Pratos", ficha: "Ficha do Prato", docs: "Central de Documentos", historico: "Histórico de alterações" })[r.v] || "";
  const V = { inicio: vInicio, manual: vManual, fichas: vFichas, ficha: vFicha, docs: vDocs, historico: vHist };
  const ix = $("#midx"), sc = ix ? ix.scrollTop : 0, sl = ix ? ix.scrollLeft : 0;

  const nx = $("#midx"); if (nx) { nx.scrollTop = sc; nx.scrollLeft = sl; const on = nx.querySelector(".on"); if (on) { const a = on.offsetTop - nx.offsetTop, b = on.offsetLeft - nx.offsetLeft; if (nx.scrollHeight > nx.clientHeight + 4 && (a < nx.scrollTop || a + on.offsetHeight > nx.scrollTop + nx.clientHeight)) nx.scrollTop = a - 60; if (nx.scrollWidth > nx.clientWidth + 4 && (b < nx.scrollLeft || b + on.offsetWidth > nx.scrollLeft + nx.clientWidth)) nx.scrollLeft = b - 20; } }

const head = (k, h, p, extra = "") => `<div class="row between" style="align-items:flex-end"><div><div class="kicker wide"><span>${k}</span></div><h1 class="h1">${h}</h1>${p ? `<p class="lead mlead">${p}</p>` : ""}</div>${extra}</div>`;

/* ---------- INÍCIO ---------- */
function vInicio() {

const itemCard = f => { const d = FD(f.id); return `<a class="mitem" href="#ficha-${f.id}"><div class="ph"><img loading="lazy" src="${IMGP(f.ph[0])}" alt=""></div><div class="tx"><b>${esc(d.t)}</b><span>Pág. ${f.p}${ED[f.id] ? ` · <em>Editada</em>` : ""}</span></div></a>`; };
const pageThumb = m => m.tipo === "ficha" || m.tipo === "imagem" ? (m.ph || [])[0] : m.tipo === "multi" ? m.itens[0].ph[0] : m.tipo === "salao" ? m.cards[0].ph : null;

/* ---------- MANUAL (páginas no formato original) ---------- */
function vManual() {
  const cap = UI.mcap, pages = capPages(cap);

  return `${head("FTO · Canva · jan/2026", "Manual de <em>Montagem de Pratos</em>", "Navegue página a página no formato original. Toque em um prato do salão para abrir a ficha.", `<div class="row">${canvaBtn}</div>`)}

/* ---------- FICHAS ---------- */
/* categorias de prato */
const PCATS = [
  { id: "op", nome: "Padrões operacionais" }, { id: "prep", nome: "Preparos de base" },
  { id: "frango", nome: "Frango" }, { id: "carne", nome: "Carnes" }, { id: "peixe", nome: "Peixes" },
  { id: "massa", nome: "Massas" }, { id: "feijoada", nome: "Feijoada" }, { id: "brasa", nome: "Churrasco e galeto" },
  { id: "outros", nome: "Outros pratos e lanches" }
];
function pcat(f) {
  if (f.cap === "op") return "op"; if (f.cap === "prep") return "prep";
  const t = norm(FD(f.id).t);
  if (/feijoada/.test(t)) return "feijoada";
  if (/churrasco|galeto/.test(t)) return "brasa";
  if (/peixe|tilapia/.test(t)) return "peixe";
  if (/parmegiana/.test(t)) return /carne|bife/.test(t) ? "carne" : "frango";
  if (/frango|sobrecoxa|tirinha|strogonoff|estrogonofe|salpicao|caesar/.test(t) && !/quiche/.test(t)) return "frango";
  if (/espaguete|spaghetti|fettuccine|nhoque|lasanha|penne/.test(t)) return "massa";
  if (/carne|bife|alcatra|escalop|figado|almondega|costela|oswaldo|iscas|panqueca|escondidinho/.test(t)) return "carne";
  return "outros";
}
const CAPC = { op: "Operacional", prep: "Preparo", del: "Delivery", sal: "Salão", sal2: "Salão p/ 2" };
const itemCard2 = f => { const d = FD(f.id); return `<a class="mitem" href="#ficha-${f.id}"><div class="ph"><img loading="lazy" src="${IMGP(f.ph[0])}" alt=""><span class="cc c-${f.cap}">${CAPC[f.cap]}</span></div><div class="tx"><b>${esc(d.t)}</b><span>Pág. ${f.p}${ED[f.id] ? ` · <em>Editada</em>` : ""}</span></div></a>`; };

  const list = base.filter(f => !cat || pcat(f) === cat);
  const cnt = id => base.filter(f => pcat(f) === id).length;
  const cats = PCATS.filter(c => list.some(f => pcat(f) === c.id));
  return `${head("Fichas dos pratos", "Todas as <em>fichas</em>", "Escolha o canal e a categoria, ou busque pelo nome do prato ou por um ingrediente.")}
  <div class="fbox sec" style="margin-top:16px">

function histList(hs, local) {

function vHist() {

/* diferenças legíveis entre duas versões */
function diffF(a, b) {
  const out = [];
  if (a.t !== b.t) out.push(`Nome: "${a.t}" → "${b.t}"`);
  const n = Math.max(a.tabs.length, b.tabs.length);
  for (let k = 0; k < n; k++) {
    const A = a.tabs[k] || { rows: [] }, B = b.tabs[k] || { rows: [] };
    if ((A.title || "") !== (B.title || "")) out.push(`Título da tabela: "${A.title || "-"}" → "${B.title || "-"}"`);
    const ia = A.rows.filter(r => r.sec == null), ib = B.rows.filter(r => r.sec == null);
    const ka = r => norm(r.i).trim();
    const ma = new Map(ia.map(r => [ka(r), r])), mb = new Map(ib.map(r => [ka(r), r]));
    ib.forEach(r => { const o = ma.get(ka(r)); if (!o) out.push(`Incluiu ${r.i}: ${r.q} ${r.u}`); else { if (o.q !== r.q || o.u !== r.u) out.push(`${r.i}: ${o.q} ${o.u} → ${r.q} ${r.u}`); if (o.i !== r.i) out.push(`Renomeou "${o.i}" → "${r.i}"`); } });
    ia.forEach(r => { if (!mb.has(ka(r))) out.push(`Removeu ${r.i} (${r.q} ${r.u})`); });
    const sa = A.rows.filter(r => r.sec != null).map(r => r.sec).join("|"), sb = B.rows.filter(r => r.sec != null).map(r => r.sec).join("|");
    if (sa !== sb) out.push(`Seções: ${sa || "-"} → ${sb || "-"}`);
    if (!out.length && ia.map(ka).join() !== ib.map(ka).join()) out.push("Mudou a ordem dos ingredientes");
  }
  if ((a.obs || "") !== (b.obs || "")) out.push("Observações alteradas");
  return out;
}
const snapF = d => ({ t: d.t, obs: d.obs || "", tabs: clone(d.tabs) });
const UNS = ["kg", "kl", "g", "l", "ml", "und"];
function edForm() {
  const E = UI.ed, d = E.d;
  return `<div class="ov" data-a="ovbg"><div class="panel wide"><div class="ph"><h3>Editar prato</h3><button class="x" data-a="close">×</button></div><div class="pb">

      <div class="er head"><span>Ingrediente</span><span>Und</span><span>Qtd.</span><span></span></div>

        : `<div class="er"><input class="input" data-e="i" data-k="${k}" data-j="${j}" value="${esc(r.i)}" placeholder="Ingrediente"><select class="input" data-e="u" data-k="${k}" data-j="${j}">${UNS.concat(UNS.includes(r.u) ? [] : [r.u]).map(u => `<option ${u === r.u ? "selected" : ""}>${esc(u)}</option>`).join("")}</select><input class="input q" data-e="q" data-k="${k}" data-j="${j}" value="${esc(r.q)}" placeholder="0,000" inputmode="decimal"><button class="rm" data-a="erm" data-k="${k}" data-j="${j}" title="Remover">×</button></div>`).join("")}
      <div class="row" style="margin-top:8px"><button class="btn ghost sm" data-a="eadd" data-k="${k}">+ Ingrediente</button><button class="btn ghost sm" data-a="esec" data-k="${k}">+ Seção</button></div>
    </div>`).join("")}
    ${d.tabs.length ? "" : `<div class="row" style="margin:14px 0"><button class="btn ghost sm" data-a="etab">+ Criar tabela de ingredientes</button></div>`}
    <label class="lbl2">Observações</label><textarea class="input" rows="4" data-e="obs">${esc(d.obs || "")}</textarea>
    <label class="lbl2">Motivo da alteração</label><input class="input" data-e="motivo" value="${esc(E.motivo || "")}" placeholder="Ex.: ajuste de porção pedido pelo chef">

  </div></div></div>`;
}
function cleanD(d) {

  return o;
}
async function gravar(id, novo, motivo, mud) {
  const ts = Date.now();
  await DB.collection("hist").add({ fid: id, ts, by: MYID, motivo: motivo || "", mud, antes: snapF(FD(id)), depois: snapF(novo) });

}
async function restaurar(hid) {

async function original(id) {
  if (!ED[id]) { closeOv(); return toast("Já é a versão original"); }
  const b = baseF(id), mud = diffF(FD(id), b);
  try { await DB.collection("hist").add({ fid: id, ts: Date.now(), by: MYID, motivo: "Voltou ao original do manual", mud, antes: snapF(FD(id)), depois: snapF(b) }); await DB.doc("fichas/" + id).delete(); closeOv(); toast("Voltou ao original do manual"); } catch (e) { toast("Não deu para voltar ao original"); }
}

function gIcon(g) { return { cozinha: IC.plate, juridico: IC.scale, franq: IC.sheet, know: IC.book, org: IC.grid, venda: IC.search, inicio: IC.home }[g] || IC.doc; }

function vDocs() {

}

/* ---------- ações ---------- */
const A = {
  mopen: el => { UI.mcap = el.dataset.c || ""; UI.mi = 0; go("manual"); window.scrollTo(0, 0); },
  mpage: el => { UI.mcap = ""; UI.mi = MONT.findIndex(m => m.p === +el.dataset.p); go("manual"); window.scrollTo(0, 0); },

  mprev: () => { UI.mi = Math.max(0, UI.mi - 1); render(); },

  fcap: el => { UI.fcap = el.dataset.v; render(); },

  close: () => closeOv(),
  ovbg: (el, ev) => { if (ev.target === el) closeOv(); },

  editar: el => { const id = el.dataset.id; UI.ed = { id, d: clone(FD(id)), motivo: "" }; setOv(edForm()); },
  eadd: el => { const tb = UI.ed.d.tabs[+el.dataset.k]; const last = tb.rows.filter(r => r.sec == null).pop(); tb.rows.push({ i: "", u: last ? last.u : "kg", q: "" }); setOv(edForm()); const ins = document.querySelectorAll(`[data-e="i"][data-k="${el.dataset.k}"]`); if (ins.length) ins[ins.length - 1].focus(); },

document.addEventListener("click", ev => {

});
function edInput(el) {
  if (!UI.ed) return; const e = el.dataset.e, d = UI.ed.d, k = +el.dataset.k, j = +el.dataset.j;
  if (e === "t") d.t = el.value; else if (e === "obs") d.obs = el.value; else if (e === "motivo") UI.ed.motivo = el.value;
  else if (e === "tt") d.tabs[k].title = el.value; else if (e === "sec") d.tabs[k].rows[j].sec = el.value;
  else if (e === "i" || e === "u" || e === "q") d.tabs[k].rows[j][e] = el.value;
}
document.addEventListener("change", ev => {

});
let tmr;
document.addEventListener("input", ev => {

  UI[k] = ev.target.value; clearTimeout(tmr);

document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") closeOv();

  if (r.v === "ficha") { const i = FICHAS.findIndex(f => f.id === r.p), t = FICHAS[i + (ev.key === "ArrowRight" ? 1 : ev.key === "ArrowLeft" ? -1 : 0)]; if (t && t.id !== r.p) location.hash = "ficha-" + t.id; }
});
window.addEventListener("hashchange", () => { closeOv(); render(); window.scrollTo(0, 0); });
render();

<script>/* trava por PIN */
(function () {
  const PIN = "2026", K = "formigueiro-pin-ok";
  let ok = false; try { ok = sessionStorage.getItem(K) === "1"; } catch (e) {}
  if (ok) return;
  const d = document.createElement("div");
  d.id = "pinlock";
  d.innerHTML = `<div class="pbox"><span class="mask m-logo"></span><div class="plbl">Ficha Técnica Operacional</div><h2>Manual de Montagem de Pratos</h2><p>Digite o PIN para acessar.</p>
    <form id="pinf" autocomplete="off"><input id="pini" type="password" inputmode="numeric" maxlength="4" placeholder="••••" aria-label="PIN" autofocus><button class="btn cream" type="submit">Entrar</button></form><div class="perr" id="pine"></div><div class="pby">Produzido por <span class="mask m-be" role="img" aria-label="Be Franchising"></span></div></div>`;
  document.body.appendChild(d); document.body.classList.add("locked");
  const i = d.querySelector("#pini"), e = d.querySelector("#pine");
  setTimeout(() => i.focus(), 50);
  const tenta = () => {
    if (i.value === PIN) { try { sessionStorage.setItem(K, "1"); } catch (x) {} d.remove(); document.body.classList.remove("locked"); }
    else { e.textContent = "PIN incorreto. Tente de novo."; i.value = ""; i.focus(); d.querySelector(".pbox").classList.remove("shake"); void d.offsetWidth; d.querySelector(".pbox").classList.add("shake"); }
  };
  d.querySelector("#pinf").addEventListener("submit", ev => { ev.preventDefault(); tenta(); });
  i.addEventListener("input", () => { i.value = i.value.replace(/\D/g, ""); e.textContent = ""; if (i.value.length === 4) tenta(); });
})();
</script>
</body>
</html>
